id: product-scope-core
title: Product scope coverage requirements
description: Executable rules for story-core completeness, mandatory capability coverage, traceability alignment, and delivered story-surface completeness.
requirements:
  - id: PROD-SCOPE-001
    title: Product story scope, traceability, and supporting surfaces stay aligned
    class: evidence_presence
    normative: MUST
    severity: error
    family: product-scope-core
    owner_roles:
      - frontend
      - architect
      - product_manager
      - qa
    applies_when:
      roles:
        - frontend
        - architect
        - product_manager
        - qa
      phases:
        - phase-6-integration-review
        - phase-7-product-acceptance
        - phase-8-qa-pre-delivery-validation
      gates:
        - quality
        - acceptance
    source_docs:
      - specs/product/traceability-matrix.md
      - playbook/process/phases/phase-1-product-definition.md
      - playbook/process/phases/phase-3-ux-and-interaction-design.md
      - playbook/process/phases/phase-6-integration-review.md
      - playbook/process/phases/phase-7-product-acceptance.md
    description: >
      The compiled product scope must stay valid from user stories through
      traceability. Current-release stories and independent-test obligations
      are primary; visible routes/pages and CTA targets are the supporting
      proof surfaces that must remain aligned with that story scope.
    validator:
      kind: python_function
      entrypoint: tools/validators/coverage/validate_frontend_route_coverage.py
    evidence:
      required_files:
        - runs/current/artifacts/product/story-quality-checklist.md
        - runs/current/evidence/quality/coverage-report.md
    exceptions:
      allowed: false
    manual_attestation:
      required: false
    remediation: >
      Implement the missing required routes or align the Product/UX scope
      contract before delivery.
