id: frontend-core
title: Frontend core requirements
description: Frontend adapter, relationship, and usability enforcement hooks.
requirements:
  - id: FE-USABILITY-001
    title: Frontend must not ship visible debug-shell or recovery copy
    class: code_pattern
    normative: MUST_NOT
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
      - product_manager
      - qa
    applies_when:
      roles:
        - frontend
        - architect
        - product_manager
        - qa
      phases:
        - phase-6-integration-review
        - phase-7-product-acceptance
        - phase-8-qa-pre-delivery-validation
      gates:
        - quality
        - acceptance
    source_docs:
      - specs/contracts/frontend/validation.md
      - playbook/process/quality-gates.md
      - playbook/roles/frontend.md
    description: >
      User-facing frontend surfaces must not read like contract recovery,
      route inventory, runtime diagnostics, or placeholder metadata shells.
    validator:
      kind: legacy_script
      entrypoint: tools/check_frontend_usability.py
    evidence:
      required_files:
        - runs/current/evidence/frontend-usability.md
        - runs/current/evidence/ui-previews/manifest.md
    exceptions:
      allowed: true
    manual_attestation:
      required: true
    remediation: >
      Replace debug-shell copy with real product copy and update the reviewed
      frontend usability evidence before handoff.

  - id: FE-ADAPTER-001
    title: Frontend uses the package-backed SAFRS adapter lane
    class: artifact_shape
    normative: MUST
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
    applies_when:
      roles:
        - frontend
        - architect
      phases:
        - phase-3-ux-and-interaction-design
        - phase-5-parallel-implementation
        - phase-6-integration-review
      gates:
        - quality
    source_docs:
      - playbook/roles/frontend.md
      - playbook/roles/architect.md
      - specs/contracts/frontend/runtime-contract.md
      - specs/contracts/frontend/admin-yaml-contract.md
    description: >
      SAFRS / ApiLogicServer frontends must use the safrs-jsonapi-client
      package as the canonical provider and normalized-schema base.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_adapter_lane_issues
    remediation: >
      Load the frontend adapter skill, keep safrs-jsonapi-client as the base
      provider/normalizer, and reduce local runtime code to thin extension
      glue.

  - id: FE-ADAPTER-002
    title: Frontend uses the approved safrs-jsonapi-client install source
    class: load_policy
    normative: MUST
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
      - devops
    applies_when:
      roles:
        - frontend
        - architect
        - devops
      phases:
        - phase-5-parallel-implementation
        - phase-6-integration-review
      gates:
        - quality
    source_docs:
      - specs/contracts/frontend/dependencies.md
      - playbook/process/dependency-materialization.md
      - playbook/process/runtime-baseline.md
    description: >
      The generated frontend must use the approved local tmp checkout of
      safrs-jsonapi-client backed by the runtime-bom source policy.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_install_source_issues
    remediation: >
      Keep runtime-bom, dependency guidance, and package.json aligned on the
      approved local safrs-jsonapi-client checkout path.

  - id: FE-ADAPTER-003
    title: Search wrappers preserve package-compatible behavior
    class: code_pattern
    normative: MUST
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
    applies_when:
      roles:
        - frontend
        - architect
      phases:
        - phase-5-parallel-implementation
        - phase-6-integration-review
      gates:
        - quality
    source_docs:
      - specs/contracts/frontend/validation.md
      - skills/safrs-jsonapi-client-frontend/SKILL.md
    description: >
      Any q-search wrapper must stay a thin package-backed extension and must
      preserve package record shape, include hydration, and totals.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_search_wrapper_issues
    remediation: >
      Rewrite the search wrapper as a thin layer around the package provider
      and preserve package normalization semantics.

  - id: FE-ADAPTER-004
    title: Relationship UI uses canonical relationship-route behavior
    class: runtime_behavior
    normative: MUST
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
      - qa
    applies_when:
      roles:
        - frontend
        - architect
        - qa
      phases:
        - phase-5-parallel-implementation
        - phase-6-integration-review
        - phase-8-qa-pre-delivery-validation
      gates:
        - quality
    source_docs:
      - specs/contracts/frontend/relationship-ui.md
      - specs/contracts/frontend/validation.md
    description: >
      Related-record UI must prefer embedded include data, then canonical
      parent relationship routes, then id-based fallback fetches.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_relationship_route_issues
    remediation: >
      Expose enough relationship metadata to build parent relationship routes
      generically and implement that route before getOne fallback.

  - id: FE-ADAPTER-005
    title: Custom SAFRS methods use execute through the adapter boundary
    class: runtime_behavior
    normative: MUST
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
      - qa
    applies_when:
      roles:
        - frontend
        - architect
        - qa
      phases:
        - phase-5-parallel-implementation
        - phase-6-integration-review
        - phase-8-qa-pre-delivery-validation
      gates:
        - quality
    source_docs:
      - playbook/roles/frontend.md
      - specs/contracts/frontend/custom-views.md
      - specs/contracts/frontend/validation.md
    description: >
      SAFRS RPC-style methods and raw JSON service calls must use
      dataProvider.execute(resource, params) through the approved adapter
      boundary.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_execute_usage_issues
    remediation: >
      Route custom SAFRS methods through dataProvider.execute(resource, params)
      and add the required validation proof.

  - id: FE-ADAPTER-006
    title: Delivered frontend code does not bypass the adapter with direct fetches
    class: code_pattern
    normative: MUST_NOT
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
      - qa
    applies_when:
      roles:
        - frontend
        - architect
        - qa
      phases:
        - phase-5-parallel-implementation
        - phase-6-integration-review
        - phase-8-qa-pre-delivery-validation
      gates:
        - quality
    source_docs:
      - playbook/roles/frontend.md
      - specs/contracts/frontend/custom-views.md
      - specs/contracts/frontend/validation.md
    description: >
      Delivered frontend behavior must not bypass the approved dataProvider
      boundary with direct component-level fetch calls.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_no_direct_fetch_issues
    remediation: >
      Extend the adapter or reopen the contract gap instead of calling backend
      APIs directly from delivery components.

  - id: FE-ADAPTER-007
    title: Generated frontend runtime and run evidence prove the adapter contract
    class: runtime_behavior
    normative: MUST
    severity: error
    family: frontend-core
    owner_roles:
      - frontend
      - architect
      - qa
    applies_when:
      roles:
        - frontend
        - architect
        - qa
      phases:
        - phase-5-parallel-implementation
        - phase-6-integration-review
        - phase-8-qa-pre-delivery-validation
      gates:
        - quality
    source_docs:
      - specs/contracts/frontend/validation.md
      - playbook/process/quality-gates.md
      - playbook/roles/qa.md
    description: >
      Runtime policy must inspect the generated frontend and run evidence, not
      only playbook prose/templates, for relationship-tab behavior, execute
      usage, and reviewed usability evidence.
    validator:
      kind: python_function
      entrypoint: tools/validators/policy/validate_frontend_adapter_contracts.py::collect_frontend_runtime_issues
    evidence:
      required_files:
        - runs/current/evidence/frontend-usability.md
        - runs/current/evidence/ui-previews/manifest.md
    remediation: >
      Fix the generated runtime and update reviewed frontend evidence so the
      delivered app, tests, and proof files all match the adapter contract.
