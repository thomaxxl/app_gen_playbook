id: hotfix-phase-h2-regression-verification
title: Hotfix phase H2 - Regression verification
owners:
  - qa
purpose: Run the smallest safe verification set for a hotfix.
entry_milestones:
  - H1-hotfix-patch-applied
exit_milestone: H2-hotfix-regression-verified
required_outputs:
  - runs/current/evidence/qa-delivery-review.md
  - runs/current/evidence/ceo-phase-reviews/hotfix-phase-h2-regression-verification.approved.md
steps:
  - id: H2-HOTFIX-REGRESSION
    title: Hotfix regression verification complete
    kind: review
    owners: [qa]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/qa-delivery-review.md
    waivable: false
  - id: H2-CEO-PHASE-REVIEW
    title: CEO critical review approves hotfix regression verification
    kind: review
    owners: [ceo]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/ceo-phase-reviews/hotfix-phase-h2-regression-verification.approved.md
    requirements:
      - PROC-CEO-PHASE-001
    waivable: false
