id: phase-I0-baseline-alignment
title: Phase I0 - Baseline alignment
owners:
  - architect
purpose: Restore trust in the accepted baseline when current app state or accepted artifacts have drifted.
exit_milestone: MI0-baseline-trust-restored
required_outputs:
  - runs/current/changes
  - runs/current/evidence/ceo-phase-reviews/phase-I0-baseline-alignment.approved.md
steps:
  - id: PI0-BASELINE-ALIGNMENT
    title: Baseline trust restored
    kind: recovery
    owners: [architect]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/changes
    waivable: false
  - id: PI0-CEO-PHASE-REVIEW
    title: CEO critical review approves phase I0 baseline alignment
    kind: review
    owners: [ceo]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/ceo-phase-reviews/phase-I0-baseline-alignment.approved.md
    requirements:
      - PROC-CEO-PHASE-001
    waivable: false
