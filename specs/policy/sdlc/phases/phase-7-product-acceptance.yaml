id: phase-7-product-acceptance
title: Phase 7 - Product acceptance
owners:
  - product_manager
purpose: Confirm the delivered system satisfies the intended user stories, pages, routes, and acceptance criteria in user terms.
entry_milestones:
  - M6-quality-gate-passed
exit_milestone: M7-acceptance-gate-passed
required_outputs:
  - runs/current/artifacts/product/acceptance-review.md
  - runs/current/evidence/ceo-phase-reviews/phase-7-product-acceptance.approved.md
steps:
  - id: P7-PRODUCT-ACCEPTANCE
    title: Product acceptance review complete
    kind: review
    owners: [product_manager]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/artifacts/product/acceptance-review.md
    requirements:
      - EVID-GATE-001
      - GATE-COV-002
      - PROD-SCOPE-001
      - UX-COV-001
    manual_attestation:
      required: true
    waivable: false
  - id: P7-CEO-PHASE-REVIEW
    title: CEO critical review approves phase 7 product acceptance
    kind: review
    owners: [ceo]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/ceo-phase-reviews/phase-7-product-acceptance.approved.md
    requirements:
      - PROC-CEO-PHASE-001
    waivable: false
