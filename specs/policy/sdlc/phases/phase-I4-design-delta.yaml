id: phase-I4-design-delta
title: Phase I4 - Design delta
owners:
  - frontend
purpose: Update UX and interaction design artifacts only where the change requires it.
entry_milestones:
  - MI3-architecture-delta-ready
exit_milestone: MI4-design-delta-ready
required_outputs:
  - runs/current/artifacts/ux/navigation.md
  - runs/current/evidence/ceo-phase-reviews/phase-I4-design-delta.approved.md
steps:
  - id: PI4-DESIGN-DELTA
    title: Design delta package complete
    kind: design
    owners: [frontend]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/artifacts/ux/navigation.md
    waivable: false
  - id: PI4-CEO-PHASE-REVIEW
    title: CEO critical review approves phase I4 design delta
    kind: review
    owners: [ceo]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/ceo-phase-reviews/phase-I4-design-delta.approved.md
    requirements:
      - PROC-CEO-PHASE-001
    waivable: false
