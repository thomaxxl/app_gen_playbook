id: phase-I5-implementation-delta
title: Phase I5 - Implementation delta
owners:
  - frontend
purpose: Apply the approved implementation delta in owned subtrees and produce updated evidence.
entry_milestones:
  - MI4-design-delta-ready
exit_milestone: MI5-delta-ready-for-regression-review
required_outputs:
  - app/run.sh
  - runs/current/evidence/ceo-phase-reviews/phase-I5-implementation-delta.approved.md
steps:
  - id: PI5-IMPLEMENTATION-DELTA
    title: Implementation delta complete
    kind: implementation
    owners: [frontend, backend]
    requiredness: required
    outputs:
      artifacts:
        - app/run.sh
    waivable: false
  - id: PI5-CEO-PHASE-REVIEW
    title: CEO critical review approves phase I5 implementation delta
    kind: review
    owners: [ceo]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/ceo-phase-reviews/phase-I5-implementation-delta.approved.md
    requirements:
      - PROC-CEO-PHASE-001
    waivable: false
