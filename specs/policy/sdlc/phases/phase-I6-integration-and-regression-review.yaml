id: phase-I6-integration-and-regression-review
title: Phase I6 - Integration and regression review
owners:
  - architect
purpose: Verify the changed implementation still matches authoritative artifacts and does not regress accepted behavior.
entry_milestones:
  - MI5-delta-ready-for-regression-review
exit_milestone: MI6-regression-gate-passed
required_outputs:
  - runs/current/artifacts/architecture/integration-review.md
  - runs/current/evidence/ceo-phase-reviews/phase-I6-integration-and-regression-review.approved.md
steps:
  - id: PI6-REGRESSION-REVIEW
    title: Regression review complete
    kind: review
    owners: [architect]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/artifacts/architecture/integration-review.md
    waivable: false
  - id: PI6-CEO-PHASE-REVIEW
    title: CEO critical review approves phase I6 integration and regression review
    kind: review
    owners: [ceo]
    requiredness: required
    outputs:
      artifacts:
        - runs/current/evidence/ceo-phase-reviews/phase-I6-integration-and-regression-review.approved.md
    requirements:
      - PROC-CEO-PHASE-001
    waivable: false
