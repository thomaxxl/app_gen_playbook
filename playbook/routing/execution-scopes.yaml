fullstack:
  title: Full stack delivery
  description: Product, UX, frontend, backend, rules, and deployment lanes may all reopen.
  active_roles:
    - product_manager
    - architect
    - frontend
    - backend
    - qa
    - devops
  new-full-run:
    active_phases:
      - phase-0-intake-and-framing
      - phase-1-product-definition
      - phase-2-architecture-contract
      - phase-3-ux-and-interaction-design
      - phase-4-backend-design-and-rules-mapping
      - phase-5-frontend-implementation
      - phase-5-backend-implementation
      - phase-6-integration-review
      - phase-7-product-acceptance
      - phase-8-qa-pre-delivery-validation
    gate_profiles:
      quality:
        - gate-quality
      acceptance:
        - gate-acceptance
      delivery:
        - gate-delivery
  iterative-change-run:
    baseline_source: accepted-artifacts
    active_phases:
      - phase-I1-change-intake-and-triage
      - phase-I2-product-and-scope-delta
      - phase-I3-architecture-and-contract-delta
      - phase-I4-frontend-design-delta
      - phase-I4-backend-design-delta
      - phase-I4-devops-delta
      - phase-I5-frontend-implementation-delta
      - phase-I5-backend-implementation-delta
      - phase-I6-integration-and-regression-review
      - phase-I7-change-acceptance
    gate_profiles:
      quality:
        - gate-quality
      acceptance:
        - gate-acceptance
      delivery:
        - gate-delivery
    default_reopened_gates:
      - phase-I2-product-and-scope-delta
      - phase-I3-architecture-and-contract-delta
      - phase-I4-frontend-design-delta
      - phase-I4-backend-design-delta
      - phase-I4-devops-delta
      - phase-I5-frontend-implementation-delta
      - phase-I5-backend-implementation-delta
      - phase-I6-integration-and-regression-review
      - phase-I7-change-acceptance
    default_candidate_artifacts:
      - runs/current/changes/*/candidate/artifacts/product/**
      - runs/current/changes/*/candidate/artifacts/architecture/**
      - runs/current/changes/*/candidate/artifacts/ux/**
      - runs/current/changes/*/candidate/artifacts/backend-design/**
      - runs/current/changes/*/candidate/artifacts/devops/**
    default_app_paths:
      - app/frontend/**
      - app/backend/**
      - app/rules/**
      - app/reference/admin.yaml
      - app/install.sh
      - app/run.sh
  app-only-hotfix:
    baseline_source: portable-baseline
    active_phases:
      - phase-I1-change-intake-and-triage
      - phase-I2-product-and-scope-delta
      - phase-I3-architecture-and-contract-delta
      - phase-I5-frontend-implementation-delta
      - phase-I5-backend-implementation-delta
      - phase-I6-integration-and-regression-review
      - phase-I7-change-acceptance
    gate_profiles:
      quality:
        - gate-quality
      acceptance:
        - gate-acceptance

