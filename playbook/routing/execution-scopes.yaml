      - runs/current/changes/*/candidate/artifacts/architecture/**
      - runs/current/changes/*/candidate/artifacts/devops/**
    default_app_paths:
      - app/.gitignore
      - app/Dockerfile
      - app/docker-compose.yml
      - app/nginx.conf
      - app/entrypoint.sh
      - app/install.sh
      - app/run.sh
