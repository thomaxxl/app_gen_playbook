rules-only:
  title: Rules-only slice
  description: Use when persisted business logic changes stay on the backend/rules lane and the UI/API shape remains approved.
  active_roles:
    - product_manager
    - architect
    - backend
    - qa
  iterative-change-run:
    baseline_source: accepted-artifacts
    active_phases:
      - phase-I1-change-intake-and-triage
      - phase-I2-product-and-scope-delta
      - phase-I3-architecture-and-contract-delta
      - phase-I4-backend-design-delta
      - phase-I5-backend-implementation-delta
      - phase-I6-integration-and-regression-review
      - phase-I7-change-acceptance
    gate_profiles:
      quality:
        - gate-quality-rules-delta
      acceptance:
        - gate-acceptance-rules-delta
      delivery:
        - gate-delivery
    default_reopened_gates:
      - phase-I2-product-and-scope-delta
      - phase-I3-architecture-and-contract-delta
      - phase-I4-backend-design-delta
      - phase-I5-backend-implementation-delta
      - phase-I6-integration-and-regression-review
      - phase-I7-change-acceptance
    default_candidate_artifacts:
      - runs/current/changes/*/candidate/artifacts/product/**
      - runs/current/changes/*/candidate/artifacts/backend-design/**
    default_app_paths:
      - app/rules/**
      - app/backend/**

devops-only:
  title: DevOps-only slice
  description: Use when deployment/runtime packaging changes without reopening product, frontend, or backend implementation by default.
  active_roles:
    - product_manager
    - architect
    - devops
    - qa
  iterative-change-run:
    baseline_source: portable-baseline
    active_phases:
      - phase-I1-change-intake-and-triage
      - phase-I2-product-and-scope-delta
      - phase-I3-architecture-and-contract-delta
      - phase-I4-devops-delta
      - phase-I6-integration-and-regression-review
      - phase-I7-change-acceptance
    gate_profiles:
      quality:
